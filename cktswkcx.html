<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出口退税文库查询</title>
    <!-- 引入 Tailwind CSS 方便快速样式美化 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">

    <div class="max-w-7xl mx-auto bg-white rounded-lg shadow-md p-6">
        <!-- 页面标题 -->
        <h1 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-3">出口退税文库查询</h1>

        <!-- 查询区域 -->
        <div class="flex flex-col sm:flex-row gap-4 mb-6">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="请输入商品编码或商品名称..." 
                class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                onkeypress="if(event.key === 'Enter') handleSearch()"
            >
            <button 
                onclick="handleSearch()" 
                id="searchBtn"
                class="px-6 py-2 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 transition duration-200 shadow-sm flex items-center justify-center min-w-[100px]"
            >
                查询
            </button>
        </div>

        <!-- 提示信息/加载状态 -->
        <div id="statusMessage" class="hidden mb-4 p-3 rounded text-sm"></div>

        <!-- 结果展示表格 -->
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50 border-b border-gray-200 text-gray-700 text-sm font-semibold">
                        <th class="p-3">商品编码</th>
                        <th class="p-3">起始日期</th>
                        <th class="p-3">终止日期</th>
                        <th class="p-3">商品名称</th>
                        <th class="p-3">征税率</th>
                        <th class="p-3">退税率</th>
                        <th class="p-3">特殊标识</th>
                    </tr>
                </thead>
                <tbody id="resultBody" class="divide-y divide-gray-200 text-sm text-gray-600">
                    <tr>
                        <td colspan="7" class="p-8 text-center text-gray-400">请输入条件并点击查询</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // 1. 初始化 Supabase 配置
        const SUPABASE_URL = 'https://iavxzvsceqhqottgdfel.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_leAmINkxNXWip3g4mnc77A_YAn2OGLM';
        
        // 注意：请将下面的 'products' 替换为你 Supabase 数据库中实际的数据表名称
        const TABLE_NAME = 'tsl'; 

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 特殊标识映射转换
        function formatTsFlag(flag) {
            const flagStr = String(flag).trim();
            if (flagStr === '1') {
                return '<span class="px-2 py-1 bg-red-100 text-red-700 rounded text-xs font-medium">征税</span>';
            } else if (flagStr === '2') {
                return '<span class="px-2 py-1 bg-green-100 text-green-700 rounded text-xs font-medium">免税</span>';
            }
            return flag !== null && flag !== undefined ? flag : '-';
        }

        // 格式化数据空值
        function formatValue(val) {
            return (val !== null && val !== undefined && val !== '') ? val : '-';
        }

        // 查询处理主函数
        async function handleSearch() {
            const keyword = document.getElementById('searchInput').value.trim();
            const resultBody = document.getElementById('resultBody');
            const searchBtn = document.getElementById('searchBtn');
            const statusMessage = document.getElementById('statusMessage');

            // 隐藏状态提示
            statusMessage.classList.add('hidden');

            // UI 加载状态
            searchBtn.disabled = true;
            searchBtn.innerText = '查询中...';
            resultBody.innerHTML = `
                <tr>
                    <td colspan="7" class="p-8 text-center text-gray-500">
                        <div class="inline-block animate-spin rounded-full h-6 w-6 border-b-2 border-blue-600 mr-2 vertical-middle"></div>
                        数据加载中...
                    </td>
                </tr>
            `;

            try {
                // 构建查询：同时匹配 CODE（编码） 或 NAME（名称）
                let query = supabaseClient.from(TABLE_NAME).select('CODE, ST_DATE, END_DATE, NAME, ZSSL_SET, TSL, TSFLAG');

                if (keyword) {
                    // ilike 表示不区分大小写的模糊匹配
                    query = query.or(`CODE.ilike.%${keyword}%,NAME.ilike.%${keyword}%`);
                } else {
                    // 如果搜索框为空，默认查询前 50 条
                    query = query.limit(50);
                }

                const { data, error } = await query;

                if (error) {
                    throw error;
                }

                // 渲染数据
                if (!data || data.length === 0) {
                    resultBody.innerHTML = `
                        <tr>
                            <td colspan="7" class="p-8 text-center text-gray-400">未查询到符合条件的数据</td>
                        </tr>
                    `;
                } else {
                    resultBody.innerHTML = data.map(item => {
                        // 判断终止日期是否为 2100-12-31（包含了对字符串和标准日期的兼容判断）
                        const endDateStr = String(item.END_DATE || '');
                        const isTargetEndDate = endDateStr.includes('2100-12-31');
                        
                        // 如果是 2100-12-31，设置绿色高亮文字样式；否则使用普通样式
                        const dateStyleClass = isTargetEndDate ? 'text-green-600 font-semibold' : '';

                        return `
                            <tr class="hover:bg-gray-50 transition">
                                <td class="p-3 font-mono font-medium text-gray-800">${formatValue(item.CODE)}</td>
                                <td class="p-3 ${dateStyleClass}">${formatValue(item.ST_DATE)}</td>
                                <td class="p-3 ${dateStyleClass}">${formatValue(item.END_DATE)}</td>
                                <td class="p-3 font-medium text-gray-800">${formatValue(item.NAME)}</td>
                                <td class="p-3">${formatValue(item.ZSSL_SET)}</td>
                                <td class="p-3">${formatValue(item.TSL)}</td>
                                <td class="p-3">${formatTsFlag(item.TSFLAG)}</td>
                            </tr>
                        `;
                    }).join('');
                }

            } catch (err) {
                console.error('查询出错:', err);
                statusMessage.className = 'mb-4 p-3 rounded text-sm bg-red-100 text-red-700 block';
                statusMessage.innerText = `查询失败: ${err.message || '请检查表名或 Supabase RLS 权限设置'}`;
                resultBody.innerHTML = `
                    <tr>
                        <td colspan="7" class="p-8 text-center text-red-400">加载失败，请重试</td>
                    </tr>
                `;
            } finally {
                // 恢复按钮状态
                searchBtn.disabled = false;
                searchBtn.innerText = '查询';
            }
        }
    </script>
</body>
</html>
