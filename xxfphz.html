<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>销项发票汇总统计</title>
  <script src="./js/xlsx.full.min.js"></script>
  <style>
    :root { --primary: #1677ff; --bg: #f5f7fa; --border: #d9d9d9; --text: #333; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; margin: 0; padding: 20px; background: var(--bg); color: var(--text); }
    .container { max-width: 1200px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    h1 { text-align: center; margin-bottom: 20px; color: #001529; }
    .toolbar { display: flex; gap: 12px; margin-bottom: 20px; align-items: center; flex-wrap: wrap; }
    input[type="file"] { padding: 8px; border: 1px dashed var(--border); border-radius: 4px; cursor: pointer; }
    .btn { padding: 8px 16px; background: var(--primary); color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; transition: background 0.2s; }
    .btn:hover { background: #0958d9; }
    .btn-print { background: #52c41a; }
    .btn-print:hover { background: #389e0d; }
    #table-wrapper { overflow-x: auto; margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border: 1px solid var(--border); padding: 8px 10px; text-align: center; vertical-align: middle; }
    th { background: #fafafa; font-weight: 600; }
    tfoot { font-weight: bold; background: #f0f7ff; }
    .num { text-align: right; font-family: Consolas, Monaco, monospace; }
    .empty-tip { text-align: center; color: #999; padding: 40px; }
    .status { margin-top: 8px; font-size: 13px; color: #666; }

    @media print {
      body { background: #fff; padding: 0; }
      .container { box-shadow: none; padding: 10px; max-width: 100%; }
      .toolbar, .status, .empty-tip, #upload-wrapper { display: none !important; }
      #table-wrapper { overflow: visible; margin-top: 0; }
      h1 { font-size: 18px; margin-bottom: 10px; text-align: left; }
      table { width: 100%; page-break-inside: auto; font-size: 12px; }
      tr { page-break-inside: avoid; }
      th, td { border: 1px solid #000; padding: 4px; }
      .num { text-align: right; }
      tfoot { border-top: 2px solid #000; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>销项发票汇总统计</h1>
    <div class="toolbar" id="upload-wrapper">
      <input type="file" id="fileInput" accept=".xlsx,.xls,.csv">
      <button id="printBtn" class="btn btn-print" style="display:none;" onclick="window.print()">🖨️ 打印报表</button>
      <span id="statusMsg" class="status"></span>
    </div>
    <div id="table-wrapper">
      <div class="empty-tip">请选择符合格式的 Excel 文件上传，系统将自动解析并生成汇总报表</div>
    </div>
  </div>

  <script>
    const INVOICE_CATEGORIES = {
      '专用发票': ['数电发票（增值税专用发票）','数电票（增值税专用发票）','数电发票（机动车销售统一发票）','数电纸质发票（增值税专用发票）','数电纸质发票（机动车销售统一发票）','增值税电子专用发票','增值税专用发票','机动车销售统一发票'],
      '普通发票': ['数电发票（普通发票）','数电票（普通发票）','数电纸质发票（普通发票）','增值税电子普通发票','增值税普通发票','增值税普通发票（卷式）','道路通行费电子普通发票','数电发票（航空运输电子客票行程单）','数电发票（铁路电子客票）','数电发票（通行费发票）'],
      '二手车发票': ['数电发票（二手车销售统一发票）','数电纸质发票（二手车销售统一发票）','二手车销售统一发票']
    };
    const STANDARD_TAX_RATES = ['13%', '9%', '6%', '5%', '3%', '1%', '0%', '免税', '不征税', '其他'];
    const TAX_RATE_RANK = {};
    STANDARD_TAX_RATES.forEach((r, i) => TAX_RATE_RANK[r] = i);
    const CATEGORY_KEYS = Object.keys(INVOICE_CATEGORIES);

    const fileInput = document.getElementById('fileInput');
    const tableWrapper = document.getElementById('table-wrapper');
    const printBtn = document.getElementById('printBtn');
    const statusMsg = document.getElementById('statusMsg');

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      statusMsg.textContent = `正在解析文件: ${file.name}...`;
      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          const data = new Uint8Array(evt.target.result);
          const workbook = XLSX.read(data, { type: 'array', cellDates: true });
          const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(firstSheet, { defval: '' });
          processData(rows);
        } catch (err) {
          statusMsg.textContent = `解析失败: ${err.message}`;
          statusMsg.style.color = 'red';
        }
      };
      reader.readAsArrayBuffer(file);
    });

    function safeParse(val) {
      if (val === null || val === undefined || val === '') return 0;
      // parseFloat 能够正确处理负号 "-"
      return parseFloat(String(val).replace(/,/g, '')) || 0;
    }

    function parseMonth(dateVal) {
      if (!dateVal) return null;
      if (dateVal instanceof Date) return `${dateVal.getFullYear()}-${String(dateVal.getMonth()+1).padStart(2,'0')}`;
      const str = String(dateVal).trim();
      const match = str.match(/(\d{4})[-\/.](\d{2})/);
      if (match) return `${match[1]}-${match[2]}`;
      if (!isNaN(dateVal) && dateVal > 30000) {
        const d = new Date(Math.round((dateVal - 25569) * 86400 * 1000));
        if (!isNaN(d)) return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      }
      return null;
    }

    function classifyType(invoiceTypeStr) {
      const s = String(invoiceTypeStr || '').trim();
      for (const [cat, types] of Object.entries(INVOICE_CATEGORIES)) {
        if (types.includes(s)) return cat;
      }
      return '普通发票';
    }

    function parseRate(val) {
      let raw = String(val || '').trim().replace(/%/g, '');
      if (!raw) return '0%';
      if (/^(免税|不征税)$/i.test(raw)) return raw;
      return raw + '%';
    }

    function processData(rows) {
      const grouped = {};
      const months = new Set();
      const taxRates = new Set();
      let count = 0;
      let skipped = 0;

      rows.forEach(row => {
        const status = String(row['发票状态'] || '').trim();
        const goodsName = String(row['货物或应税劳务名称'] || '').trim();

        if (status === '已作废') { skipped++; return; }
        if (goodsName === '(详见销货清单)' || goodsName === '（详见销货清单）') { skipped++; return; }

        const month = parseMonth(row['开票日期']);
        if (!month) return;

        const rate = parseRate(row['税率']);
        const amount = safeParse(row['金额']);
        const tax = safeParse(row['税额']);
        const category = classifyType(row['发票票种']);

        months.add(month);
        taxRates.add(rate);

        if (!grouped[month]) grouped[month] = {};
        if (!grouped[month][rate]) {
          grouped[month][rate] = {};
          CATEGORY_KEYS.forEach(k => grouped[month][rate][k] = { amt: 0, tax: 0 });
        }
        grouped[month][rate][category].amt += amount;
        grouped[month][rate][category].tax += tax;
        count++;
      });

      renderTable(grouped, Array.from(months).sort(), Array.from(taxRates));
      statusMsg.textContent = `解析完成！共统计 ${count} 条记录。已排除作废及销货清单明细行。`;
      statusMsg.style.color = 'green';
      printBtn.style.display = 'inline-block';
    }

    // 辅助函数：格式化数字并处理负数样式
    function formatNum(num) {
      const val = num.toFixed(2);
      return num < 0 ? `<span class="neg">${val}</span>` : val;
    }

    function renderTable(grouped, sortedMonths, rawRates) {
      rawRates.sort((a, b) => {
        const rankA = TAX_RATE_RANK[a] !== undefined ? TAX_RATE_RANK[a] : 999;
        const rankB = TAX_RATE_RANK[b] !== undefined ? TAX_RATE_RANK[b] : 999;
        return rankA - rankB || a.localeCompare(b);
      });

      let html = `<table id="reportTable">
        <thead>
          <tr>
            <th rowspan="2" style="min-width: 90px;">年月</th>
            <th rowspan="2" style="min-width: 70px;">税率</th>`;
      CATEGORY_KEYS.forEach(cat => { html += `<th colspan="2">${cat}</th>`; });
      html += `</tr><tr>`;
      CATEGORY_KEYS.forEach(() => { html += `<th>金额(元)</th><th>税额(元)</th>`; });
      html += `</tr></thead><tbody>`;

      const totals = {};
      CATEGORY_KEYS.forEach(k => totals[k] = { amt: 0, tax: 0 });

      for (const m of sortedMonths) {
        const monthData = grouped[m];
        let monthRendered = false;

        // 核心优化点：只要任何一个类别的金额或税额不等于 0（包括负数），就视为有效行
        const validRates = rawRates.filter(r => {
          if (!monthData[r]) return false;
          return CATEGORY_KEYS.some(k => 
            Math.abs(monthData[r][k].amt) > 0.001 || Math.abs(monthData[r][k].tax) > 0.001
          );
        });

        for (const r of validRates) {
          const d = monthData[r];
          CATEGORY_KEYS.forEach(k => {
            totals[k].amt += d[k].amt;
            totals[k].tax += d[k].tax;
          });

          let monthCellHtml = '';
          if (!monthRendered) {
            monthCellHtml = `<td class="month-cell" rowspan="${validRates.length}">${m}</td>`;
            monthRendered = true;
          }

          html += `<tr>${monthCellHtml}<td>${r}</td>`;
          CATEGORY_KEYS.forEach(k => {
            html += `<td class="num">${formatNum(d[k].amt)}</td><td class="num">${formatNum(d[k].tax)}</td>`;
          });
          html += `</tr>`;
        }
      }

      html += `</tbody><tfoot><tr><td colspan="2">总计</td>`;
      CATEGORY_KEYS.forEach(k => {
        html += `<td class="num">${formatNum(totals[k].amt)}</td><td class="num">${formatNum(totals[k].tax)}</td>`;
      });
      html += `</tr></tfoot></table>`;

      tableWrapper.innerHTML = html;
    }
  </script>
</body>
</html>
